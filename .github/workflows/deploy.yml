name: Deploy to cPanel via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install and build frontend assets
        run: |
          npm ci || npm install
          npm run build

      - name: Patch public/index.php paths for cPanel
        run: |
          sed -i "s#__DIR__.'/../storage/framework/maintenance.php'#__DIR__.'/../laravel-app/storage/framework/maintenance.php'#" public/index.php || true
          sed -i "s#__DIR__.'/../vendor/autoload.php'#__DIR__.'/../laravel-app/vendor/autoload.php'#" public/index.php
          sed -i "s#__DIR__.'/../bootstrap/app.php'#__DIR__.'/../laravel-app/bootstrap/app.php'#" public/index.php

      - name: Deploy app code to laravel-app
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          security: loose
          timeout: 600000
          local-dir: ./
          server-dir: laravel-app/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/public/**
            **/tests/**
            **/storage/logs/**
            **/.env

      - name: Deploy public/ contents to public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          security: loose
          timeout: 600000
          local-dir: ./public/
          server-dir: public_html/